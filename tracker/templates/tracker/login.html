<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    {% extends "tracker/base.html" %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <div class="auth-logo">
            SpendWise
        </div>

        <h2>Welcome back</h2>

        <p class="auth-subtitle">
            Sign in to manage your finances.
        </p>

        {% if error %}
            <div class="auth-error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>

            <input
                type="text"
                name="username"
                placeholder="Enter your username"
                required
            >

            <label>Password</label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Sign In
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{% url 'register' %}">Create one</a>
        </p>

    </div>

</div>

{% endblock %}
</body>
</html>
